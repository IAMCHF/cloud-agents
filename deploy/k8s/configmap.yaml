apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-agents-config
  namespace: cloud-agents
data:
  PUBLIC_BASE_URL: http://cloud-agents.127.0.0.1.nip.io
  P1_OWNER: local-user
  OPENSANDBOX_BASE_URL: http://opensandbox-server.opensandbox-system.svc.cluster.local
  SANDBOX_IMAGE: cloud-agents/sandbox:0.1.0
  SANDBOX_RUNTIME: kubernetes
  VOLUME_BACKEND: pvc
  # 留空用集群默认 StorageClass；非 kind 集群按实际值改。
  WORKSPACE_PVC_STORAGE_CLASS: ""
  WORKSPACE_PVC_SIZE: 1Gi
  # codex 状态盘（CODEX_HOME）独立 PVC，休眠/销毁沙箱后保留供冷恢复。
  STATE_PVC_SIZE: 1Gi
  # 卷归档：仅已结束会话；默认 dry-run（TRUE 时只出计划不落包）。
  ARCHIVE_ENABLED: "true"
  ARCHIVE_ROOT: /archive
  ARCHIVE_RETENTION_DAYS: "30"
  ARCHIVE_DRY_RUN: "true"
  ARCHIVE_TIMEOUT_SECONDS: "600"
  SANDBOX_NETWORK_DEFAULT_ACTION: deny
  SANDBOX_EGRESS_ALLOW: ""
  # 应用预览：子域反代 `<session>--<port>.preview.<base>`；生产换成通配 DNS 的预览域。
  PREVIEW_BASE_DOMAIN: 127.0.0.1.nip.io
  SANDBOX_CPU: "1"
  SANDBOX_MEMORY: 1Gi
  SANDBOX_TIMEOUT_SECONDS: "3600"
  SANDBOX_START_TIMEOUT_SECONDS: "180"
  MAX_ACTIVE_SESSIONS: "4"
  # 多副本：WS 落到任意副本时按台账重建通道；创建超时的 creating 才被启动对账结束。
  CREATING_STALE_TIMEOUT_SECONDS: "300"
  LLM_UPSTREAM_BASE_URL: https://api.deepseek.com
  LLM_TIMEOUT_SECONDS: "600"
  CODEX_MODEL: deepseek-flash
  AUDIT_FLUSH_INTERVAL_SECONDS: "0.2"
