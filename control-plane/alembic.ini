# NOTE: keep this file ASCII-only - Alembic's ConfigParser uses the OS locale encoding.
[alembic]
script_location = migrations
prepend_sys_path = .
# Production DSN comes from the DATABASE_URL env var; never commit real credentials.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/cloud_agents

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
