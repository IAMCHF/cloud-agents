[project]
name = "cloud-agents-control-plane"
version = "0.1.0"
description = "云端 Agent 执行服务控制面"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "joserfc>=1.8",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
# 应用仓库，不作为 Python 包分发：不构建、不装自身，`uv run` 直接以工作目录为准。
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
# RUF001–003：中文注释/文档字符串使用全角标点，属预期写法。
# ASYNC109：超时参数用于有界等待与进程清理，函数内部已用 wait_for 实现。
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# 测试里 `with pytest.raises(...)` 与 websocket 上下文嵌套能更清楚表达意图。
"tests/**" = ["SIM117"]
# E2E 启动脚本：uvicorn 未暴露启动事件，只能轮询 started 标志。
"tests/e2e/**" = ["ASYNC110"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["app"]
branch = true
# 进程启动壳：真实逻辑在 entry.py，本文件只被集成测试以子进程方式执行（覆盖率统计不到子进程）。
omit = ["app/bridge/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
