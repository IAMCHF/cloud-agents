# networkPolicy 载荷形状参考——由控制面随创建请求自动下发，无需手工提交本文件。
# 实际配置入口：控制面环境变量 SANDBOX_EGRESS_ALLOW（逗号分隔 target、target:port 或 [IPv6]:port）；
# 控制面/网关地址自动放行，其余默认拒绝（SANDBOX_NETWORK_DEFAULT_ACTION=deny）。
# 四类放行：控制面 WSS、LLM 网关（自动）、内部 git、包镜像（后两类配 SANDBOX_EGRESS_ALLOW）。
# 目标用部署实际域名/CIDR 占位；不要在仓库写内网真实地址。
defaultAction: deny
egress:
  - action: allow
    target: "<控制面域名>"        # 自动加入，无需配置
  - action: allow
    target: "<内部 git 域名>"
  - action: allow
    target: "<包镜像域名>"

# 执行前提与已知限制（2026-11-18 实测，见 docs/tests/2026-11-18-P1-egress与cgroup验证.md）：
# - OpenSandbox 需 network_mode="bridge" + [egress] sidecar 且 mode="dns+nft"；
#   dns 模式只拦 DNS 解析，直连 IP 可绕过，不满足默认全拒。
# - ports 字段仅 IP/CIDR 规则可带（API 校验），但 egress sidecar v1.1.7 不执行端口过滤，
#   白名单实际为 IP 级；域名规则忽略端口。sidecar 升级后须复测。
# - codex 自身外联（auth/telemetry/更新检查）即容器网络，由默认 deny 兜底，无需单独配置。